spring:
  datasource:
    url: jdbc:mysql://${MYSQL_URL}:${MYSQL_PORT}/${MYSQL_DB}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  profiles:
    active: local

  servlet:
    multipart:
      enabled: true
      max-file-size: 3MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

google:
  client-id: ${GOOGLE_CLIENT_ID}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0  

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL}
  chain-id: 80002
  mock-usdc-address: ${MOCK_USDC_ADDRESS}
  tiny-payment-address: ${TINY_PAYMENT_ADDRESS}
  server-wallet:
    address: ${SERVER_WALLET_ADDRESS}
    private-key: ${SERVER_WALLET_PRIVATE_KEY}
  encryption:
    master-key: ${WALLET_ENCRYPTION_KEY}
  gas:
    price: 30000000000
    limit: 300000
